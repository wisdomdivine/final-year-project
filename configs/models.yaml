models:
  mlr:
    fit_intercept: true
    copy_X: true
    n_jobs: -1

  random_forest:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 4
    min_samples_leaf: 2
    max_features: "sqrt"
    bootstrap: true
    random_state: 42
    n_jobs: -1

  catboost:
    iterations: 500
    learning_rate: 0.05
    depth: 6
    loss_function: "RMSE"
    eval_metric: "RMSE"
    random_seed: 42
    verbose: false

  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 4
    min_samples_split: 4
    min_samples_leaf: 2
    subsample: 0.8
    loss: "squared_error"
    random_state: 42

  mlp:
    hidden_layer_sizes: [64, 32]
    activation: "relu"
    solver: "adam"
    alpha: 0.001
    batch_size: "auto"
    learning_rate: "adaptive"
    learning_rate_init: 0.005
    max_iter: 1000
    random_state: 42
    early_stopping: true
    n_iter_no_change: 25

