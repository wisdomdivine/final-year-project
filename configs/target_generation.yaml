      - [3296.8, 3299.2]
      - [3326.3, 3330.1]
    test_range: [13, 16]
    excluded_dry_test: 17
  Skagerrak:
    top_md: 3340.0000
    base_md: 3403.5492
    regime_type: "overpressured"
    # Discrete measured physical anchors (held strictly separate from assumptions):
    primary_measured_anchors:
      test_20:
        md_m: 3386.99
        tvd_rkb_m: 3026.27
        formation_pressure_bar: 368.706
        status: "measured_anchor"
      test_21:
        md_m: 3403.57
        tvd_rkb_m: 3036.26
        formation_pressure_bar: 368.818
        status: "measured_anchor"
    # Apparent gradient across measured anchors: delta P = 0.112 bar over 9.99 m TVD
    apparent_gradient_bar_m: 0.01121
    apparent_fluid_density_gcc: 0.1143
    gradient_status: "unresolved_fluid_model"
    brine_gradient_rejected_reason: "Forcing 0.101 bar/m brine gradient over 9.99 m TVD separation predicts 1.009 bar delta vs measured 0.112 bar delta, introducing 0.90 bar error."
    # Provisional target-generation assumption (explicitly NOT a proven physical profile):
    provisional_compartment_assumption_bar: 368.762
    provisional_assumption_status: "provisional_target_generation_assumption"
    provisional_assumption_warning: "The 368.762 bar value is a mathematical construction assumption for continuous labeling, not a proven physical pressure profile. Substantial uncertainty exists when extrapolating away from Tests 20 and 21, particularly upward toward 3340.0 m MD."
    extrapolation_uncertainty:
      anchored_sand_interval_md: [3386.5, 3403.55]
      anchored_sand_uncertainty_bar: 0.15
      untested_upper_skagerrak_md: [3340.0, 3386.5]
      untested_upper_skagerrak_uncertainty_bar: 5.00
    # Gauge repeatability audit note:
    gauge_repeatability_status: "unverified_assumption"
    gauge_repeatability_note: "The FPWD well report does not provide manufacturer-certified repeatability or total uncertainty specifications for the AQAP quartz gauge. The +/-0.05 to +/-0.10 bar figure is an unverified external rule of thumb, not an established instrument specification."
    # Test 19 preserved as official memory readout observation:
    test_19_memory_recovery:
      pressure_bar: 357.714
      mobility_md_cp: 5.37
      quality_status: "official_memory_readout"
      telemetry_status: "realtime_telemetry_shutdown"
      companion_repeat_test: 21
      discrepancy_with_test_21_bar: 11.104
      calibration_role: "excluded_from_calibration"
      reliability_note: "Not equivalent in reliability to Tests 20 and 21; excluded as a calibration anchor; retained solely as an unresolved operational conflict observation."
    # Corrected overpressure under Trajectory 1 (TVD MSL = 2,983.34 m; Ph = 301.30 bar):
    overpressure_trajectory_1_bar: 67.52
    overpressure_trajectory_1_psi: 979.3
    # Deprecated Trajectory 2 overpressure (uncorrected surface tie-in, TVD MSL = 3,017.83 m):
    overpressure_trajectory_2_deprecated_bar: 63.76
    test_range: [18, 21]

