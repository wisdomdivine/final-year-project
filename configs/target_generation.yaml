formation_regimes:
  Hugin:
    top_md: 3127.7052
    base_md: 3263.5000
    fluid_type: "oil"
    oil_gradient_bar_m: 0.070276
    oil_density_gcc: 0.7167
    api_gravity: 42.6
    # Regression equations depending on coordinate reference frame:
    # 1. Referenced to TVD RKB (Schlumberger table datum):
    intercept_rkb_bar: 118.2048
    # 2. Referenced to TVD MSL (TVD_RKB - 54.90 m):
    intercept_msl_bar: 122.0629
    r2_score: 0.999915
    air_gap_offset_bar: 3.8582
    test_range: [1, 12]
  Sleipner:
    top_md: 3263.5000
    base_md: 3340.0000
    fluid_type: "baffled_regime"
    pressure_range_bar: [334.10, 341.71]
    calcite_hardground_intervals_md:
      - [3286.5, 3290.8]
      - [3296.8, 3299.2]
      - [3326.3, 3330.1]
    test_range: [13, 16]
    excluded_dry_test: 17
  Skagerrak:
    top_md: 3340.0000
    base_md: 3403.5492
    regime_type: "overpressured"
    # Fluid model: Tests 20 & 21 exhibit delta P = 0.112 bar over 9.99 m TVD (apparent gradient 0.0112 bar/m).
    # Normal brine gradient (0.101 bar/m) is physically rejected as it introduces an artificial ~0.90 bar distortion.
    fluid_model: "constant_compartment_pressure"
    mean_compartment_pressure_bar: 368.762
    apparent_gradient_bar_m: 0.01121
    apparent_fluid_density_gcc: 0.1143
    gradient_status: "unresolved_fluid_model"
    gauge_repeatability_margin_bar: 0.10
    brine_gradient_rejected_reason: "Forcing 0.101 bar/m brine gradient over 9.99 m TVD separation predicts 1.009 bar delta vs measured 0.112 bar delta, introducing 0.90 bar error."
    stabilized_pressure_stations:
      test_20: 368.706
      test_21: 368.818
    # Test 19 preserved as official memory readout observation:
    test_19_memory_recovery:
      pressure_bar: 357.714
      mobility_md_cp: 5.37
      quality_status: "official_memory_readout"
      telemetry_status: "realtime_telemetry_shutdown"
      companion_repeat_test: 21
      discrepancy_with_test_21_bar: 11.104
    # Corrected overpressure under Trajectory 1 (TVD MSL = 2,983.34 m; Ph = 301.30 bar):
    overpressure_trajectory_1_bar: 67.52
    overpressure_trajectory_1_psi: 979.3
    # Deprecated Trajectory 2 overpressure (uncorrected surface tie-in, TVD MSL = 3,017.83 m):
    overpressure_trajectory_2_deprecated_bar: 63.76
    test_range: [18, 21]

transition_zones:
  sleipner_skagerrak:
    top_md: 3326.0000
    base_md: 3386.5000
    length_m: 60.5
    data_status: "unsupported_by_permeable_tests"
    primary_policy: "exclude_from_primary_target"
    mask_primary_training_target: true
    rationale: "Unmeasured mudstone interval crossing validation and test splits; synthetic interpolation would corrupt objective function with unverified mathematical spline."
    sensitivity_experiment: true
    sensitivity_scenarios:
      - "linear_ramp"
      - "sharp_basal_seal"
      - "sharp_top_skagerrak_seal"

eaton_calibration:
